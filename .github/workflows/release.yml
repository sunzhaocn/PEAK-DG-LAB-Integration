name: Build Windows Portable and Release

on:
  pull_request:
    paths:
      - 'Coyote/**'
      - '.github/workflows/release.yml'
      - 'RELEASE_NOTES_*.md'
  push:
    branches: [main]
    paths:
      - 'Coyote/**'
      - '.github/workflows/release.yml'
      - 'RELEASE_NOTES_*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coyote-windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $text = Get-Content 'Coyote/src/Coyote/app_version.py' -Raw
          if ($text -notmatch 'APP_VERSION\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"') { throw 'APP_VERSION not found' }
          $version = $Matches[1]
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building Coyote $version"

      - name: Put bun.exe into DG-LAB server directory
        shell: pwsh
        run: |
          $bun = (Get-Command bun.exe -ErrorAction Stop).Source
          $target = 'Coyote/dglab-websocket-server-main/bun.exe'
          Copy-Item -LiteralPath $bun -Destination $target -Force
          if (-not (Test-Path -LiteralPath $target)) { throw 'bun.exe copy failed' }
          & $target --version
          Get-Item $target | Format-Table FullName,Length

      - name: Build declaration-only PEAK reference assembly
        shell: pwsh
        run: dotnet build 'Coyote/reference-stubs/Assembly-CSharp.csproj' -c Release

      - name: Build Windows x64 portable package from source
        shell: pwsh
        working-directory: Coyote
        env:
          PEAK_REFERENCE_ASSEMBLY: ${{ github.workspace }}\Coyote\artifacts\bin\Assembly-CSharp\release\Assembly-CSharp.dll
        run: .\build_exe_selfcontained.ps1

      - name: Validate portable output
        shell: pwsh
        run: |
          $zip = 'Coyote/release/Coyote_Windows_x64_Portable.zip'
          $exe = 'Coyote/dist/Coyote/Coyote.exe'
          $dll = 'Coyote/dist/Coyote/plugin/Coyote.dll'
          $bun = 'Coyote/dist/Coyote/dglab-websocket-server-main/bun.exe'
          $server = 'Coyote/dist/Coyote/dglab-websocket-server-main/v4-server.ts'
          foreach ($path in @($zip,$exe,$dll,$bun,$server,'Coyote/dist/Coyote/LICENSE','Coyote/dist/Coyote/BUN-LICENSE.md','Coyote/dist/Coyote/NOTICE.md')) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing release output: $path" }
          }
          if (Test-Path -LiteralPath 'Coyote/dist/Coyote/reference-stubs') { throw 'Reference stubs must not ship in the release.' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $names = @($archive.Entries | ForEach-Object { $_.FullName -replace '\\','/' })
            foreach ($required in @('Coyote.exe','plugin/Coyote.dll','dglab-websocket-server-main/bun.exe','dglab-websocket-server-main/v4-server.ts','LICENSE','BUN-LICENSE.md','NOTICE.md')) {
              if ($required -notin $names) { throw "Portable ZIP does not contain $required" }
            }
            foreach ($name in $names) {
              if ($name -match '(^|/)(tests|node_modules|__pycache__)/|(^|/)[^/]+\.lock$|(^|/)package\.json$') {
                throw "Development file in portable ZIP: $name"
              }
            }
          }
          finally { $archive.Dispose() }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          Get-Item $zip,$exe,$dll,$bun | Format-Table FullName,Length
          Write-Host "SHA256 $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: Coyote-Windows-x64-${{ steps.version.outputs.version }}
          path: Coyote/release/Coyote_Windows_x64_Portable.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Coyote-Windows-x64-${{ needs.build.outputs.version }}
          path: Coyote/release

      - name: Publish GitHub Release package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $latestMain = (gh api "repos/$env:GITHUB_REPOSITORY/branches/main" --jq '.commit.sha').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve the latest main commit before release publishing.' }
          if ($latestMain -ne $env:GITHUB_SHA) {
            Write-Host "Skipping stale build $env:GITHUB_SHA; current main is $latestMain."
            exit 0
          }

          gh release view $env:VERSION --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:VERSION already exists; leaving its tag, notes and assets unchanged."
            exit 0
          }

          $existingTag = (gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:VERSION" --jq '.object.sha' 2>$null)
          if ($LASTEXITCODE -eq 0 -and $existingTag.Trim() -ne $env:GITHUB_SHA) {
            throw "Tag $env:VERSION points to $existingTag, not this build $env:GITHUB_SHA."
          }

          $notes = "RELEASE_NOTES_$env:VERSION.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw "Missing release notes: $notes" }
          gh release create $env:VERSION `
            'Coyote/release/Coyote_Windows_x64_Portable.zip' `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Coyote $env:VERSION" `
            --notes-file $notes
